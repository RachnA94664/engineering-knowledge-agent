[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic generates the migrations; gen_seed.py is compact data tables.
extend-exclude = ["migrations/versions", "data/gen_seed.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
