# One command starts everything:   docker compose up --build
#   UI:       http://localhost:8080
#   API docs: http://localhost:8000/docs
#
# The AI runs on your own PC with Ollama (free). From inside a container, your PC is
# "host.docker.internal". Keys are read from your shell or a root .env file, never from the image.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - eka-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the API, so this must be an address the BROWSER can reach.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  eka-data:
